services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      # Pre-create this file before first run: touch ./backend/audit_jobs.db
      # Docker creates a directory instead of a file if it doesn't exist yet.
      - ./backend/audit_jobs.db:/app/audit_jobs.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
